    <!--Gallery section-->
    <!--Eventually I want each item to grow when you hover-->
    <!--clicking should allow a larger view, looking at other images in same foler, reading description-->
    <div id="imagegrid" class="gridContainer" ></div>

    <!--TODO: Move this into app.js-->
    <script>
        let imgArray = [
            "Barbara Heart.png",
            "Bear Friend.png",
            "Butterfly Embroidery.png",
            "Crying Moon.png",
            "Fuck Your Juice Cleanse.png",
            "House At Dawn Loom.png",
            "Lock and Flowers.png",
            "Strawberry Loom.png",
            "Sunset Loom.png",
            "Teenage Reliquary.png"
        ];


        let container = document.querySelector('#imagegrid');
        for (var i = 0; i < imgArray.length; i++) {

            let div = document.createElement('div');
            let img = document.createElement('img');

            // container.appendChild(div);
            container.appendChild(ImageGridItem(img, i));
        }
        
        function ImageGridItem(image, i) {
            const img = document.createElement('img');

            img.className = 'img';
            img.src = "art/" + imgArray[i];
            img.alt = imgArray[i];
            img.id="image-clicked"
            img.addEventListener("click", () => displayArt(img));

            img.style.gridColumnEnd = `span ${getSpanEstimate(image.width)}`;
            img.style.gridRowEnd = `span ${getSpanEstimate(image.height)}`;

            return img;
        }

        function getSpanEstimate(size) {
            if (size > 250) {
                return 2;
            }

            return 1;
        }

    </script>
